# The OrderCore demo on one small server (Docs/specs/operations/aws-demo-deployment.md):
# Caddy (HTTPS) -> API, PostgreSQL, RabbitMQ and Mailpit, all on one network.
# Only Caddy publishes ports. Run by scripts/deploy.sh, which renders
# api.env / stack.env / mailpit-auth.caddy from SSM Parameter Store first
# (always run with --env-file stack.env) — no secret lives in this file.
name: ordercore

networks:
  ordercore-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  rabbitmq-data:
  mailpit-data:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_IP_DASHED: ${PUBLIC_IP_DASHED:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./mailpit-auth.caddy:/etc/caddy/mailpit-auth.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - mailpit
    mem_limit: 128m
    networks:
      - ordercore-net

  api:
    image: ghcr.io/leo-slv/ordercore-api:${IMAGE_TAG:?Set IMAGE_TAG (deploy.sh does)}
    restart: unless-stopped
    env_file: api.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      # The aspnet image has no curl/wget: bash's /dev/tcp makes the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 640m
    networks:
      - ordercore-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ordercore
      POSTGRES_USER: ordercore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=60"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordercore -d ordercore"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    networks:
      - ordercore-net

  rabbitmq:
    image: rabbitmq:4
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ordercore
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    mem_limit: 384m
    networks:
      - ordercore-net

  # The demo's e-mails land here instead of real mailboxes; its web inbox is
  # published only through Caddy, behind a password.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    mem_limit: 96m
    networks:
      - ordercore-net

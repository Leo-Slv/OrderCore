name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch (or PR) cancels the run still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OrderCore.sln

      - name: Build
        run: dotnet build OrderCore.sln --no-restore --configuration Release

      - name: Formatting
        run: dotnet format OrderCore.sln --no-restore --verify-no-changes

      - name: Unit tests
        run: >-
          dotnet test Tests/OrderCore.UnitTests --no-build --configuration Release
          --logger trx --results-directory TestResults/unit

      - name: Architecture tests
        run: >-
          dotnet test Tests/OrderCore.ArchitectureTests --no-build --configuration Release
          --logger trx --results-directory TestResults/architecture

      # Start their own PostgreSQL, RabbitMQ and stripe-mock containers
      # (Testcontainers); the runner has Docker.
      - name: Integration tests
        run: >-
          dotnet test Tests/OrderCore.IntegrationTests --no-build --configuration Release
          --logger trx --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # The demo's server files (deploy/aws) are not exercised by the .NET tests:
  # check that the compose file, the Caddyfile and the scripts are valid.
  deploy-files:
    name: Check the AWS demo's server files
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Compose file
        working-directory: deploy/aws
        run: |
          {
            echo IMAGE_TAG=sha-ci
            echo PUBLIC_IP_DASHED=203-0-113-10
            echo POSTGRES_PASSWORD=x
            echo RABBITMQ_PASSWORD=y
          } > stack.env
          touch api.env mailpit-auth.caddy
          docker compose --env-file stack.env config --quiet

      - name: Caddyfile
        working-directory: deploy/aws
        run: |
          echo 'demo placeholder-hash' > mailpit-auth.caddy
          docker run --rm -e PUBLIC_IP_DASHED=203-0-113-10 -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -v "$PWD/mailpit-auth.caddy:/etc/caddy/mailpit-auth.caddy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Shell scripts
        run: shellcheck deploy/aws/scripts/*.sh

      - name: CloudFormation template
        run: pipx run cfn-lint deploy/aws/ordercore-demo.yaml deploy/aws/backup-bucket.yaml

  # Only a green master publishes: the API image, which also carries the
  # migrate step (`docker run <image> migrate`, Docs/operations/deployment.md).
  # The demo is deployed from it by deploy-demo below; any other hosting is manual.
  publish-image:
    name: Publish the API image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the owner's name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ordercore-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 for the demo's Graviton server (Docs/specs/operations/aws-demo-deployment.md).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploys the demo (Docs/specs/operations/aws-demo-deployment.md): CI asks
  # the server, through SSM, to run deploy/aws/scripts/deploy.sh for this
  # commit - no SSH, no AWS key in GitHub (OIDC). It only runs once the
  # repository variable DEMO_DEPLOY_ROLE_ARN exists, so CI stays green before
  # the stack does. Set in the GitHub "demo" environment (Docs/operations/aws-demo.md):
  # DEMO_DEPLOY_ROLE_ARN, DEMO_INSTANCE_ID, DEMO_API_URL, DEMO_AWS_REGION (optional).
  deploy-demo:
    name: Deploy the demo
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEMO_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.DEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.DEMO_AWS_REGION || 'us-east-1' }}

      - name: Deploy through SSM
        env:
          INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --parameters commands="/opt/ordercore/deploy.sh $SHA" \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"
          status=Pending
          for _ in $(seq 1 180); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Success|Failed|Cancelled|TimedOut|Cancelling) break ;; esac
            sleep 10
          done
          echo "::group::Output of deploy.sh"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "::endgroup::"
          echo "Status: $status"
          [ "$status" = Success ]

      - name: Health check through HTTPS
        env:
          API_URL: ${{ vars.DEMO_API_URL }}
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$API_URL/health/ready"

  # The same deploy for a server OUTSIDE AWS (Docs/operations/free-vm-demo.md):
  # CI runs deploy.sh over SSH. Inert until the "demo" environment has the
  # variables DEMO_SSH_HOST (and optionally DEMO_SSH_USER, default ubuntu,
  # DEMO_API_URL) and the secret DEMO_SSH_KEY (a private key whose public half
  # is in the server's authorized_keys; optionally DEMO_SSH_KNOWN_HOSTS).
  deploy-demo-ssh:
    name: Deploy the demo over SSH
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.DEMO_SSH_HOST != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: demo
    concurrency:
      group: demo-deploy
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Deploy
        env:
          HOST: ${{ vars.DEMO_SSH_HOST }}
          SSH_USER: ${{ vars.DEMO_SSH_USER || 'ubuntu' }}
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_SSH_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts
          fi
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 "$SSH_USER@$HOST" "sudo /opt/ordercore/deploy.sh $SHA"

      - name: Health check through HTTPS
        env:
          API_URL: ${{ vars.DEMO_API_URL }}
        run: curl -fsS --retry 6 --retry-delay 10 --retry-all-errors "$API_URL/health/ready"

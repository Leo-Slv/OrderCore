name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch (or PR) cancels the run still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build, format and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore
        run: dotnet restore OrderCore.sln

      - name: Build
        run: dotnet build OrderCore.sln --no-restore --configuration Release

      - name: Formatting
        run: dotnet format OrderCore.sln --no-restore --verify-no-changes

      - name: Unit tests
        run: >-
          dotnet test Tests/OrderCore.UnitTests --no-build --configuration Release
          --logger trx --results-directory TestResults/unit

      - name: Architecture tests
        run: >-
          dotnet test Tests/OrderCore.ArchitectureTests --no-build --configuration Release
          --logger trx --results-directory TestResults/architecture

      # Start their own PostgreSQL, RabbitMQ and stripe-mock containers
      # (Testcontainers); the runner has Docker.
      - name: Integration tests
        run: >-
          dotnet test Tests/OrderCore.IntegrationTests --no-build --configuration Release
          --logger trx --results-directory TestResults/integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # Only a green master publishes: the API image, which also carries the
  # migrate step (`docker run <image> migrate`, Docs/operations/deployment.md).
  # The deploy itself stays manual until the hosting is chosen.
  publish-image:
    name: Publish the API image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      # Registry paths must be lowercase; the owner's name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ordercore-api" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

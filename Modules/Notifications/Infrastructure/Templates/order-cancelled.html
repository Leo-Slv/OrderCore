<table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="56" height="56" align="center" valign="middle" style="width:56px;height:56px;border-radius:16px;background:#f1f0ec;color:#44444a;font-size:26px;line-height:56px;font-weight:bold;">&#10005;</td></tr></table>
<h1 class="title" style="margin:20px 0 0;font-size:32px;font-weight:300;letter-spacing:-0.025em;line-height:1.12;color:#18181b;">Pedido cancelado</h1>
<p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#44444a;">{{greeting}}</p>
<p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#44444a;">Seu pedido <strong>{{orderNumber}}</strong>, no valor de {{total}}, foi cancelado.</p>
<div style="margin:24px 0 0;padding:16px 18px;border-radius:14px;background:#f4f3ef;font-size:14px;line-height:1.55;color:#18181b;"><span style="display:block;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:0.12em;color:#6b6b72;padding-bottom:4px;">MOTIVO</span>{{reason}}</div>
<p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#44444a;">Se algum valor foi cobrado, ele será devolvido pelo mesmo meio de pagamento.</p>
<div style="height:24px;line-height:24px;">&nbsp;</div>

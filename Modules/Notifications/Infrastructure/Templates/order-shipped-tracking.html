<table role="presentation" cellpadding="0" cellspacing="0"><tr><td width="56" height="56" align="center" valign="middle" style="width:56px;height:56px;border-radius:16px;background:{{brandSoftColor}};color:{{brandColor}};font-size:26px;line-height:56px;font-weight:bold;">&rarr;</td></tr></table>
<h1 class="title" style="margin:20px 0 0;font-size:32px;font-weight:300;letter-spacing:-0.025em;line-height:1.12;color:#18181b;">Seu pedido está a caminho</h1>
<p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#44444a;">{{greeting}}</p>
<p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#44444a;">Seu pedido <strong>{{orderNumber}}</strong> saiu para entrega.</p>
<div style="margin:24px 0 0;padding:16px 18px;border-radius:14px;background:{{brandSoftColor}};font-size:14px;line-height:1.55;color:#18181b;"><span style="display:block;font-family:'Courier New',Courier,monospace;font-size:10px;letter-spacing:0.12em;color:{{brandColor}};padding-bottom:4px;">ENVIO</span>{{shipment}}</div>
<table role="presentation" cellpadding="0" cellspacing="0" width="100%"><tr><td style="padding:28px 0 8px;"><a class="btn" href="{{trackingUrl}}" style="display:inline-block;padding:15px 28px;border-radius:12px;background:{{brandColor}};color:#ffffff;text-decoration:none;font-size:16px;font-weight:500;line-height:22px;">Acompanhar entrega</a></td></tr></table>
<div style="height:24px;line-height:24px;">&nbsp;</div>

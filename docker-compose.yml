networks:
  ordercore-net:
    driver: bridge

services:
  # Ambiente local: OrderCore + PostgreSQL + RabbitMQ (mensageria
  # assíncrona entre módulos, Docs/specs/events/async-messaging.md) +
  # Grafana LGTM (observabilidade).
  # Redis entra no compose somente quando um módulo passar a depender
  # dele de fato, não antecipadamente.
  postgres:
    image: postgres:16-alpine
    container_name: ordercore-postgres
    environment:
      POSTGRES_DB: ordercore
      POSTGRES_USER: ordercore
      POSTGRES_PASSWORD: ordercore
    ports:
      # Host port 5433, not 5432: some dev machines already have a
      # different Postgres bound to 5432 on the host's own network stack
      # (a native install or a WSL2 distro's own instance), which silently
      # wins over Docker Desktop's port-proxy for connections made from the
      # host itself (dotnet run/dotnet ef outside the container) even
      # though container-to-container traffic on the compose network is
      # unaffected. 5433 avoids that collision. The container's own
      # internal port stays 5432 — only the host-side mapping changed.
      - "5433:5432"
    volumes:
      - ordercore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordercore -d ordercore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ordercore-net

  rabbitmq:
    image: rabbitmq:4-management
    container_name: ordercore-rabbitmq
    environment:
      # Credentials from the git-ignored .env (see .env.example).
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI: http://localhost:15672
    volumes:
      - ordercore-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ordercore-net

  # Observability backend (Docs/specs/observability/observability.md):
  # OpenTelemetry collector + Tempo (traces), Loki (logs), Prometheus
  # (metrics) and Grafana in one container, with its data in a volume.
  # Grafana: http://localhost:3001 (3000 is the storefront).
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: ordercore-otel-lgtm
    ports:
      - "3001:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - ordercore-otel-lgtm-data:/data
      # OrderCore's dashboards, provisioned from the repository (read-only).
      - ./deploy/grafana/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/ordercore.yaml:ro
      - ./deploy/grafana/dashboards:/otel-lgtm/ordercore-dashboards:ro
      # Alert rules as code, and the collector with tail sampling of traces.
      - ./deploy/grafana/alerting/ordercore-rules.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/ordercore-rules.yaml:ro
      - ./deploy/otel/otelcol-config.yaml:/otel-lgtm/otelcol-config.yaml:ro
    environment:
      # Keep every trace locally (debugging); the collector's default is 10%.
      TRACE_SAMPLING_PERCENTAGE: ${TRACE_SAMPLING_PERCENTAGE:-100}
    networks:
      - ordercore-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordercore-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      otel-lgtm:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderCoreDb: "Host=postgres;Port=5432;Database=ordercore;Username=ordercore;Password=ordercore"
      # Secrets come from a git-ignored .env next to this file (copy
      # .env.example). The API refuses to start without a signing key.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (see .env.example)}
      IdentitySeed__AdminEmail: ${ADMIN_EMAIL:-}
      IdentitySeed__AdminPassword: ${ADMIN_PASSWORD:-}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env (see .env.example)}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (see .env.example)}
      # Stripe in test mode (Docs/specs/payments/stripe-provider.md): with
      # STRIPE_SECRET_KEY empty the API uses the fake provider.
      Payments__Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Payments__Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      Payments__Stripe__WebhookSecret: ${STRIPE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4317
      # Metrics every 10 s (the SDK default is 60 s), so local dashboards react quickly.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
    ports:
      - "8080:8080"
    healthcheck:
      # Ready = PostgreSQL and RabbitMQ reachable. The aspnet image has no
      # curl/wget, so bash's /dev/tcp makes the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ordercore-net

  # Forwards Stripe's test-mode webhooks to the API — Stripe can't reach
  # localhost. Only with the keys in .env: docker compose --profile stripe up.
  # Its signing secret (STRIPE_WEBHOOK_SECRET) is stable per account:
  #   docker compose --profile stripe run --rm --no-deps stripe-cli listen --print-secret
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: ordercore-stripe-cli
    profiles: ["stripe"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
    command:
      - listen
      - --forward-to
      - http://api:8080/api/payments/webhooks/stripe
      # Only the events OrderCore acts on (StripeWebhookHandler).
      - --events
      - payment_intent.amount_capturable_updated,payment_intent.payment_failed,payment_intent.succeeded,payment_intent.canceled,charge.refund.updated,charge.dispute.created
    networks:
      - ordercore-net

volumes:
  ordercore-postgres-data:
  ordercore-rabbitmq-data:
  ordercore-otel-lgtm-data:

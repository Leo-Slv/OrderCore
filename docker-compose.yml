networks:
  ordercore-net:
    driver: bridge

services:
  # Fase 1 do ambiente local (seção 41 do contexto do projeto): apenas
  # OrderCore + PostgreSQL. Redis e RabbitMQ entram no compose somente
  # quando um módulo passar a depender de fato deles (cache/locks reais e
  # comunicação assíncrona real), não antecipadamente.
  postgres:
    image: postgres:16-alpine
    container_name: ordercore-postgres
    environment:
      POSTGRES_DB: ordercore
      POSTGRES_USER: ordercore
      POSTGRES_PASSWORD: ordercore
    ports:
      # Host port 5433, not 5432: some dev machines already have a
      # different Postgres bound to 5432 on the host's own network stack
      # (a native install or a WSL2 distro's own instance), which silently
      # wins over Docker Desktop's port-proxy for connections made from the
      # host itself (dotnet run/dotnet ef outside the container) even
      # though container-to-container traffic on the compose network is
      # unaffected. 5433 avoids that collision. The container's own
      # internal port stays 5432 — only the host-side mapping changed.
      - "5433:5432"
    volumes:
      - ordercore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordercore -d ordercore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ordercore-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ordercore-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrderCoreDb: "Host=postgres;Port=5432;Database=ordercore;Username=ordercore;Password=ordercore"
      # Secrets come from a git-ignored .env next to this file (copy
      # .env.example). The API refuses to start without a signing key.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env (see .env.example)}
      IdentitySeed__AdminEmail: ${ADMIN_EMAIL:-}
      IdentitySeed__AdminPassword: ${ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    networks:
      - ordercore-net

volumes:
  ordercore-postgres-data:
